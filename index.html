<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コンビニソフト — CONVENISOFT</title>
  <style>
    :root {
      --bg: #FAF6F0;
      --bg-card: #F2EBE0;
      --text: #1C1816;
      --text-muted: #6B5C4E;
      --accent: #7A5C1E;
      --divider: #E2D5BC;
      --link: #7A5C1E;
      --shadow: rgba(28,24,22,0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1A1714;
        --bg-card: #241F1B;
        --text: #E8E0D4;
        --text-muted: #9E8E7E;
        --accent: #C4962A;
        --divider: #3A3028;
        --link: #C4962A;
        --shadow: rgba(0,0,0,0.3);
      }
    }
    :root[data-theme="light"] {
      --bg: #FAF6F0; --bg-card: #F2EBE0; --text: #1C1816; --text-muted: #6B5C4E;
      --accent: #7A5C1E; --divider: #E2D5BC; --link: #7A5C1E; --shadow: rgba(28,24,22,0.08);
    }
    :root[data-theme="dark"] {
      --bg: #1A1714; --bg-card: #241F1B; --text: #E8E0D4; --text-muted: #9E8E7E;
      --accent: #C4962A; --divider: #3A3028; --link: #C4962A; --shadow: rgba(0,0,0,0.3);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", -apple-system, system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.8;
    }

    /* ── Navigation ── */
    .site-nav {
      position: sticky;
      top: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--divider);
      z-index: 100;
    }
    .site-nav .inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
    }
    .nav-brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      font-weight: normal;
      letter-spacing: 0.12em;
      color: var(--accent);
      text-decoration: none;
    }
    .nav-links {
      list-style: none;
      display: flex;
    }
    .nav-links > li {
      position: relative;
    }
    .nav-links > li > a {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 14px;
      height: 52px;
      font-size: 14px;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }
    .nav-links > li > a:hover { color: var(--accent); }
    .nav-arrow {
      font-size: 10px;
      opacity: 0.6;
      transition: transform 0.2s;
    }
    .nav-links > li.open > a .nav-arrow,
    .nav-links > li:hover > a .nav-arrow { transform: rotate(180deg); }

    .dropdown {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      min-width: 140px;
      background: var(--bg-card);
      border: 1px solid var(--divider);
      border-radius: 6px;
      box-shadow: 0 4px 16px var(--shadow);
      list-style: none;
      padding: 6px 0;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
      transition: opacity 0.15s, transform 0.15s;
    }
    .nav-links > li:hover .dropdown,
    .nav-links > li:focus-within .dropdown,
    .nav-links > li.open .dropdown {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .dropdown a {
      display: block;
      padding: 9px 16px;
      font-size: 14px;
      color: var(--text);
      text-decoration: none;
    }
    .dropdown a:hover { background: var(--bg); color: var(--accent); }

    /* ── Main content ── */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 20px 80px;
    }

    header.page-header {
      margin-bottom: 56px;
      padding-bottom: 36px;
      border-bottom: 2px solid var(--accent);
    }
    .brand-label {
      display: inline-block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      font-weight: normal;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }
    h1 {
      font-family: "Hiragino Mincho ProN", "Noto Serif JP", Georgia, serif;
      font-size: clamp(26px, 5vw, 36px);
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
      margin-bottom: 20px;
      text-wrap: balance;
    }
    .intro {
      font-size: 15px;
      line-height: 1.9;
      color: var(--text-muted);
      max-width: 600px;
    }

    /* ── App list ── */
    .section-label {
      font-family: Georgia, serif;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--divider);
      opacity: 0.8;
    }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .app-card {
      background: var(--bg-card);
      border: 1px solid var(--divider);
      border-radius: 10px;
      padding: 22px 24px;
      text-decoration: none;
      display: block;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .app-card:hover {
      box-shadow: 0 4px 16px var(--shadow);
      border-color: var(--accent);
    }
    .app-card-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-weight: normal;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .app-card-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.7;
    }
    .app-card-platforms {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 14px;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--divider);
    }

    /* ── Footer ── */
    footer {
      margin-top: 80px;
      padding-top: 24px;
      border-top: 1px solid var(--divider);
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    @media (max-width: 480px) {
      .container { padding: 40px 16px 64px; }
    }
  </style>
</head>
<body>

  <nav class="site-nav" aria-label="サイトナビゲーション">
    <div class="inner">
      <a class="nav-brand" href="index.html">CONVENISOFT</a>
      <ul class="nav-links">
        <li>
          <a href="#apps" aria-haspopup="true">アプリケーション <span class="nav-arrow">▾</span></a>
          <ul class="dropdown" role="menu">
            <li><a href="memon/" role="menuitem">Memon</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <header class="page-header">
      <h1>コンビニソフト</h1>
      <p class="intro">みなさまのお役に立てるアプリケーションのご提供を目標にしております。<br>今後もさまざまなアイデアをアプリケーションとしてご提供していきます。<br>ぜひ一度ご利用ください。</p>
    </header>

    <section id="apps">
      <p class="section-label">Applications</p>
      <div class="app-grid">
        <a class="app-card" href="memon/">
          <div class="app-card-name">Memon</div>
          <p class="app-card-desc">メーラーライクな３ペイン型リッチテキスト対応のメモ管理アプリ</p>
          <div class="app-card-platforms">
            <span class="badge">macOS</span>
            <span class="badge">iOS</span>
            <span class="badge">Android</span>
            <span class="badge">Windows</span>
          </div>
        </a>
      </div>
    </section>

    <footer>
      <p>Copyright &copy; 2026 CONVENISOFT. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    // モバイルタップでドロップダウン開閉
    document.querySelectorAll('.nav-links > li > a').forEach(function(link) {
      link.addEventListener('click', function(e) {
        var li = this.parentElement;
        if (li.querySelector('.dropdown')) {
          e.preventDefault();
          var isOpen = li.classList.contains('open');
          document.querySelectorAll('.nav-links > li').forEach(function(el) { el.classList.remove('open'); });
          if (!isOpen) li.classList.add('open');
        }
      });
    });
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.nav-links')) {
        document.querySelectorAll('.nav-links > li').forEach(function(el) { el.classList.remove('open'); });
      }
    });
  </script>
</body>
</html>
